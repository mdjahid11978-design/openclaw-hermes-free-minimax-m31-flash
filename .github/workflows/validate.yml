name: Repository validation

on:
  push:
    branches:
      - main
      - "jahids-ai/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate setup and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python runtime
        working-directory: runtime
        run: |
          python -m compileall -q jahids_runtime tests
          PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Build runtime container
        run: docker build --file runtime/Dockerfile --tag jahids-agent-runtime:ci .
      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
            echo "PASS: $file"
          done < <(find scripts -type f -name '*.sh' -print0)
      - name: Validate JSON5 configuration
        run: |
          npx --yes json5 config/openclaw-m31-flash.patch.json5 >/dev/null
          echo "PASS: JSON5 syntax"
      - name: Check for accidentally committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

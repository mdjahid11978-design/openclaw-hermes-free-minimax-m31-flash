services:
  jahids-runtime:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    image: jahids-agent-runtime:0.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    env_file:
      - .env
    environment:
      JAHIDS_HOST: 0.0.0.0
      JAHIDS_WEB_DIR: /app/web
      JAHIDS_DB_PATH: /app/data/jahids-runtime.sqlite3
      JAHIDS_ALLOW_REMOTE_BIND: "true"
    volumes:
      - jahids-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  jahids-data:
